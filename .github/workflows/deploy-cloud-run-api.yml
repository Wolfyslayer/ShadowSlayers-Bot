name: Deploy Cloud Run API

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type shadowslayers-api to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production-shadowslayers-api
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: shadowslayers-7f48f
  CLOUD_RUN_SERVICE: shadowslayers-api
  CLOUD_RUN_REGION: europe-west4

jobs:
  deploy:
    name: Build, verify and deploy API
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'shadowslayers-api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository security checks
        run: npm run security:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck and lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build trusted API
        run: npm run build:api

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployment target and record rollback revision
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(metadata.name)' | grep -Fx "$CLOUD_RUN_SERVICE"
          previous_revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.traffic[0].revisionName)')"
          test -n "$previous_revision"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Deploy source as a new Cloud Run revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --quiet
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          deployed_revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$service_url"
          test -n "$deployed_revision"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "deployed_revision=$deployed_revision" >> "$GITHUB_OUTPUT"

      - name: Verify deployed API health or restore previous revision
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --retry-all-errors "$SERVICE_URL/api/health" --output health.json \
            || ! node -e "const h=require('./health.json'); if(h.ok !== true) process.exit(1)"; then
            echo "Health verification failed; restoring traffic to $PREVIOUS_REVISION" >&2
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$CLOUD_RUN_REGION" \
              --to-revisions "$PREVIOUS_REVISION=100" \
              --quiet
            exit 1
          fi

      - name: Publish deployment summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          DEPLOYED_REVISION: ${{ steps.deploy.outputs.deployed_revision }}
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
        shell: bash
        run: |
          {
            echo "## Cloud Run API deployment"
            echo "- Service: \`$CLOUD_RUN_SERVICE\`"
            echo "- Region: \`$CLOUD_RUN_REGION\`"
            echo "- New revision: \`$DEPLOYED_REVISION\`"
            echo "- Rollback revision: \`$PREVIOUS_REVISION\`"
            echo "- Health endpoint verified: \`$SERVICE_URL/api/health\`"
          } >> "$GITHUB_STEP_SUMMARY"

