name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Security & AI Hygiene Check
        run: npm run security:check
      - name: Dependency Security Audit
        run: npm audit --audit-level=high
      - name: Typecheck and Lint
        run: npm run lint
      - name: Unit and Integration Tests
        run: npm test

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Standalone Bot
        run: npm run build:bot
      - name: Verify Standalone Startup
        run: npm run check:bot-startup

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Static Dashboard Without Discord Credentials
        run: npm run build:dashboard
      - name: Verify Built Frontend Has No Private Credentials
        run: npm run security:check

